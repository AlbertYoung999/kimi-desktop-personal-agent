<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a8f98"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a6fe8"/>
    </marker>
  </defs>

  <!-- user + command center -->
  <rect x="285" y="14" width="210" height="44" rx="10" fill="#f4f7ff" stroke="#c9dbff"/>
  <text x="390" y="33" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1e21">用户 · 自然语言指令</text>
  <text x="390" y="49" text-anchor="middle" font-size="10.5" fill="#4b5058">「给 task-flow 加个项目功能」</text>

  <line x1="390" y1="58" x2="390" y2="78" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- kimi session -->
  <rect x="260" y="80" width="260" height="56" rx="10" fill="#fff6ec" stroke="#f2d9b8"/>
  <text x="390" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1e21">kimi（ACP 会话）</text>
  <text x="390" y="116" text-anchor="middle" font-size="10.5" fill="#4b5058">挂载工作台 MCP · 原生 tool calling</text>
  <text x="390" y="130" text-anchor="middle" font-size="10.5" fill="#4b5058">参数校验 · 结果回传 · 自我修正</text>

  <!-- MCP server -->
  <line x1="352" y1="136" x2="352" y2="168" stroke="#1a6fe8" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="428" y1="168" x2="428" y2="136" stroke="#1a6fe8" stroke-width="1.5" marker-end="url(#arrB)"/>
  <rect x="260" y="170" width="260" height="48" rx="10" fill="#eaf2ff" stroke="#1a6fe8"/>
  <text x="390" y="190" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a6fe8">Workbench MCP Server</text>
  <text x="390" y="206" text-anchor="middle" font-size="10.5" fill="#4b5058">127.0.0.1 · 12 tools · zod schema</text>

  <!-- tool fan-out -->
  <line x1="390" y1="218" x2="390" y2="236" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="16" y="238" width="168" height="66" rx="10" fill="#eef9f1" stroke="#bfe6cb"/>
  <text x="100" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c1e21">数据层工具</text>
  <text x="100" y="274" text-anchor="middle" font-size="10" fill="#4b5058">task_* / radar_*</text>
  <text x="100" y="290" text-anchor="middle" font-size="10" fill="#4b5058">tasks / radars JSON</text>

  <rect x="204" y="238" width="168" height="66" rx="10" fill="#eef9f1" stroke="#bfe6cb"/>
  <text x="288" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c1e21">布局工具</text>
  <text x="288" y="274" text-anchor="middle" font-size="10" fill="#4b5058">widget_open / close</text>
  <text x="288" y="290" text-anchor="middle" font-size="10" fill="#4b5058">舞台与 Dock</text>

  <rect x="392" y="238" width="176" height="66" rx="10" fill="#eef9f1" stroke="#bfe6cb"/>
  <text x="480" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c1e21">artifact_modify</text>
  <text x="480" y="274" text-anchor="middle" font-size="10" fill="#4b5058">改自定义组件 HTML</text>
  <text x="480" y="290" text-anchor="middle" font-size="10" fill="#4b5058">→ 舞台自动重挂载</text>

  <rect x="588" y="238" width="176" height="66" rx="10" fill="#ffeef5" stroke="#f0b8d0"/>
  <text x="676" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c1e21">widget_modify</text>
  <text x="676" y="274" text-anchor="middle" font-size="10" fill="#4b5058">改内置 widget 源码</text>
  <text x="676" y="290" text-anchor="middle" font-size="10" fill="#4b5058">→ esbuild 重建 → 热重载</text>

  <!-- evolve log -->
  <rect x="16" y="326" width="552" height="44" rx="10" fill="#f4f5f7" stroke="#e3e5e9"/>
  <text x="292" y="344" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c1e21">演化日志 evolve.jsonl + 快照撤销（evolve_undo）</text>
  <text x="292" y="360" text-anchor="middle" font-size="10" fill="#4b5058">每次操作可追溯 · 逐帧回滚 · widget 源码回滚后自动重建</text>

  <!-- safety rails -->
  <rect x="588" y="326" width="176" height="100" rx="10" fill="#fff8e8" stroke="#eed9a4"/>
  <text x="676" y="346" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c1e21">不改 crash 的防线</text>
  <text x="676" y="364" text-anchor="middle" font-size="10" fill="#4b5058">① schema 校验（MCP 层）</text>
  <text x="676" y="380" text-anchor="middle" font-size="10" fill="#4b5058">② 构建失败自动回滚</text>
  <text x="676" y="396" text-anchor="middle" font-size="10" fill="#4b5058">③ 快照撤销 · error boundary</text>
  <text x="676" y="412" text-anchor="middle" font-size="10" fill="#4b5058">④ fs 沙箱按会话 cwd 隔离</text>

  <!-- fan lines to log -->
  <line x1="100" y1="304" x2="100" y2="326" stroke="#8a8f98" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="288" y1="304" x2="288" y2="326" stroke="#8a8f98" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="480" y1="304" x2="480" y2="326" stroke="#8a8f98" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="676" y1="304" x2="676" y2="322" stroke="#8a8f98" stroke-width="1" marker-end="url(#arr)"/>
</svg>
