<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <!-- renderer layer -->
  <rect x="20" y="50" width="210" height="250" rx="12" fill="#f4f7ff" stroke="#c9dbff"/>
  <text x="125" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#1c1e21">渲染层（UI）</text>
  <rect x="36" y="92" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="125" y="116" text-anchor="middle" font-size="12" fill="#1c1e21">悬浮球 · 眼动 / 空闲动画</text>
  <rect x="36" y="142" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="125" y="166" text-anchor="middle" font-size="12" fill="#1c1e21">对话窗 · 流式渲染</text>
  <rect x="36" y="192" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="125" y="216" text-anchor="middle" font-size="12" fill="#1c1e21">会话 / 收藏夹 / 设置面板</text>
  <rect x="36" y="242" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="125" y="266" text-anchor="middle" font-size="12" fill="#1c1e21">截图 · 粘贴 · 引用 · 队列</text>

  <!-- main process -->
  <rect x="285" y="50" width="210" height="250" rx="12" fill="#eef9f1" stroke="#bfe6cb"/>
  <text x="390" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#1c1e21">Electron 主进程</text>
  <rect x="301" y="92" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="390" y="116" text-anchor="middle" font-size="12" fill="#1c1e21">ACPManager</text>
  <rect x="301" y="142" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="390" y="166" text-anchor="middle" font-size="12" fill="#1c1e21">窗口管理 · 全局快捷键</text>
  <rect x="301" y="192" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="390" y="216" text-anchor="middle" font-size="12" fill="#1c1e21">截图 · 权限仲裁</text>
  <rect x="301" y="242" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="390" y="266" text-anchor="middle" font-size="12" fill="#1c1e21">本地配置 / vault 读写</text>

  <!-- agent -->
  <rect x="550" y="50" width="210" height="200" rx="12" fill="#fff6ec" stroke="#f2d9b8"/>
  <text x="655" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#1c1e21">kimi acp 子进程</text>
  <rect x="566" y="92" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="655" y="116" text-anchor="middle" font-size="12" fill="#1c1e21">会话 · 模型推理</text>
  <rect x="566" y="142" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="655" y="166" text-anchor="middle" font-size="12" fill="#1c1e21">工具调用（写文件等）</text>
  <rect x="566" y="192" width="178" height="40" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
  <text x="655" y="216" text-anchor="middle" font-size="12" fill="#1c1e21">历史持久化（自带）</text>

  <!-- local storage -->
  <rect x="285" y="350" width="475" height="60" rx="12" fill="#f4f5f7" stroke="#e3e5e9"/>
  <text x="522" y="374" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1e21">本地数据</text>
  <text x="522" y="394" text-anchor="middle" font-size="11.5" fill="#4b5058">settings.json · modes.json · workspace/vault/*.md · ~/.kimi-code 会话存储</text>

  <!-- arrows -->
  <line x1="230" y1="175" x2="278" y2="175" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="278" y1="190" x2="230" y2="190" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="257" y="165" text-anchor="middle" font-size="10.5" fill="#8a8f98">IPC</text>

  <line x1="495" y1="130" x2="543" y2="130" stroke="#1a6fe8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="543" y1="160" x2="495" y2="160" stroke="#1a6fe8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="519" y="118" text-anchor="middle" font-size="10.5" fill="#1a6fe8">ACP · JSON-RPC / stdio</text>
  <text x="519" y="180" text-anchor="middle" font-size="10.5" fill="#1a6fe8">流式更新 / 权限请求</text>

  <line x1="655" y1="250" x2="655" y2="342" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="662" y="300" font-size="10.5" fill="#8a8f98">写入收藏</text>

  <line x1="390" y1="300" x2="390" y2="342" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="397" y="326" font-size="10.5" fill="#8a8f98">读写配置</text>
</svg>
