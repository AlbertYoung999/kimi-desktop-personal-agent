<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="btn-sessions" class="icon-btn" title="会话">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <span id="session-title">新会话</span>
      <div class="spacer"></div>
      <button id="btn-vault" class="icon-btn" title="收藏夹">
        <svg viewBox="0 0 24 24"><path d="M6.5 4h11a.5.5 0 0 1 .5.5v15l-6-4-6 4v-15a.5.5 0 0 1 .5-.5z"/></svg>
      </button>
      <button id="btn-new" class="icon-btn" title="新建会话">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="设置">
        <svg viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2.2"/><circle cx="8" cy="16" r="2.2"/></svg>
      </button>
      <button id="btn-workbench" class="icon-btn" title="主页 (⌘⇧J)">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.5"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" title="月之暗面">
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
      </button>
      <button id="btn-pin" class="icon-btn pinned" title="置顶">
        <svg viewBox="0 0 24 24"><path d="M9 4h6l-.8 6.2L17 13v2H7v-2l2.8-2.8z"/><path d="M12 15v5"/></svg>
      </button>
      <button id="btn-close" class="icon-btn" title="收起">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div id="messages"></div>

    <div id="mode-bar"></div>

    <div id="attach-preview" class="hidden">
      <img id="attach-img" alt="screenshot" />
      <button id="attach-remove">×</button>
    </div>

    <div id="queue-bar" class="hidden"></div>

    <div id="quote-preview" class="hidden">
      <div id="quote-text"></div>
      <button id="quote-remove">×</button>
    </div>

    <div id="input-area">
      <div id="input-shell">
        <button id="btn-capture" class="icon-btn" title="截图">
          <svg viewBox="0 0 24 24"><path d="M7 3v12a2 2 0 0 0 2 2h12"/><path d="M3 7h12a2 2 0 0 1 2 2v12"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="问点什么…"></textarea>
        <button id="btn-send" title="发送">
          <svg viewBox="0 0 24 24"><path d="M21 3L10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 9.8z"/></svg>
        </button>
      </div>
    </div>

    <div id="permission-bar" class="hidden">
      <div id="permission-text"></div>
      <div class="perm-actions">
        <button id="perm-allow" class="btn-primary">允许</button>
        <button id="perm-always" class="btn-ghost">本会话允许</button>
        <button id="perm-deny" class="btn-danger">拒绝</button>
      </div>
    </div>

    <div id="panel-sessions" class="panel hidden">
      <div class="panel-title">会话 <button class="panel-close icon-btn"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="session-list"></div>
    </div>

    <div id="panel-vault" class="panel hidden">
      <div class="panel-title">收藏夹 <button class="panel-close icon-btn"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="vault-body">
        <div id="vault-list"></div>
        <div id="vault-editor" class="hidden">
          <div id="vault-editor-title"></div>
          <textarea id="vault-content"></textarea>
          <div class="vault-editor-actions">
            <button id="vault-save" class="btn-primary">保存</button>
            <button id="vault-back" class="btn-ghost">返回</button>
          </div>
        </div>
      </div>
    </div>

    <div id="panel-settings" class="panel hidden">
      <div class="panel-title">设置 <button class="panel-close icon-btn"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="settings-body">
        <label>工作文件夹</label>
        <div class="row">
          <span id="settings-workspace" class="path"></span>
          <button id="btn-pick-workspace" class="btn-ghost">选择…</button>
        </div>
        <label>权限模式</label>
        <select id="settings-perm-mode">
          <option value="default">每次询问</option>
          <option value="auto">自动（安全项）</option>
          <option value="yolo">全部允许</option>
        </select>
        <label>预设模式</label>
        <div id="modes-editor"></div>
        <button id="btn-add-mode" class="btn-ghost">＋ 新增模式</button>
      </div>
    </div>
  </div>
  <script src="./index.js"></script>
</body>
</html>
