<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="./avatar.png" />
  <link rel="icon" href="./avatar.png" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./chat-panel.css" />
  <title>KIMI · talking to the moon</title>
</head>
<body>
  <div id="background"></div>
  <div id="stars"></div>
  <div id="moon-glow"></div>
  <div id="moon-container"></div>

  <!-- 统一顶栏(chat/moon/SA 三屏):左=会话列表 / 中=小球+会话名 / 右=设置 -->
  <div id="topbar">
    <button id="tb-list" class="glass-fab" aria-label="会话列表" title="会话列表">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="tb-center">
      <div id="tb-ball">
        <div id="tb-gloss"></div>
        <div id="tb-face"><span class="tb-eye"></span><span class="tb-eye"></span></div>
        <span id="tb-ball-badge" hidden>1</span>
      </div>
      <div id="tb-label">选择会话</div>
    </div>
    <button id="tb-menu" class="glass-fab" aria-label="设置" title="设置">···</button>
  </div>

  <!-- 小球管家:待检查任务面板(turn 已完成且未读的 session 汇总) -->
  <div id="tb-panel" hidden>
    <div id="tb-panel-title">待检查 0 项</div>
    <div id="tb-panel-list"></div>
    <button id="tb-panel-clear">全部已读</button>
  </div>

  <div id="top-bar">
    <div id="connection-status" title="连接状态"></div>
    <div id="date-display">--</div>
    <div id="phase-name">--</div>
    <div id="phase-detail">--</div>
  </div>

  <div id="toast"></div>

  <!-- 工具调用状态行(result-card 上方一行小字,滚动更新,turn 结束隐藏) -->
  <div id="tool-line"></div>

  <div id="result-card">
    <div id="result-scroll">
      <div id="result-text"></div>
    </div>
    <button id="result-expand" class="expand-btn" aria-label="展开">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
      </svg>
    </button>
  </div>

  <!-- 权限审批卡片(moon 没有;出现在 result-card 区域) -->
  <div id="perm-card">
    <div id="perm-title"></div>
    <div id="perm-actions"></div>
  </div>


  <div id="history-modal">
    <div class="modal-card history-card">
      <div class="modal-title" id="history-title">对话记录</div>
      <div id="history-list"></div>
      <div class="modal-actions">
        <button id="history-close" class="text-btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 底部抽屉式项目树(会话切换) -->
  <div id="session-drawer">
    <div class="drawer-sheet">
      <div class="drawer-handle"></div>
      <div class="drawer-title">选择会话</div>
      <div id="drawer-tree"></div>
      <div class="drawer-footer">
        <span></span>
        <button id="drawer-close" class="text-btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- HTTPS 指引(语音需要 secure context) -->
  <div id="guide-modal">
    <div class="modal-card guide-card">
      <div class="modal-title">启用语音（HTTPS）</div>
      <ol id="guide-steps"></ol>
      <a id="guide-open" class="guide-open" href="#">打开 HTTPS 版 →</a>
      <div class="modal-actions">
        <button id="guide-close" class="text-btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 底部抽屉式菜单(背景切换 / 语音播报 / 历史记录 / HTTPS 指引) -->
  <div id="menu-drawer">
    <div class="drawer-sheet">
      <div class="drawer-handle"></div>
      <div class="drawer-title">菜单</div>
      <div class="menu-sec">背景</div>
      <div class="menu-bg-row">
        <button id="menu-bg-prev" class="menu-item">‹ 上一个背景</button>
        <button id="menu-bg-next" class="menu-item">下一个背景 ›</button>
      </div>
      <div class="menu-sec">设置</div>
      <button id="menu-tts" class="menu-item">🔊 语音播报：开</button>
      <button id="menu-history" class="menu-item">🕘 历史记录</button>
      <button id="menu-guide" class="menu-item" hidden>HTTPS 指引</button>
      <div class="drawer-footer">
        <span></span>
        <button id="menu-close" class="text-btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 经典对话模式(createChatPanel 工厂整建制挂载;左右悬浮玻璃按钮,nav bar 删除) -->
  <div id="chat-view">
    <div id="cv-panel" class="cv-scope"></div>
  </div>

  <!-- Super Agent 屏(左右悬浮玻璃按钮;分段 inset;对话 = 工厂复用远程后端) -->
  <div id="sa-view">
    <div class="sa-seg">
      <button data-seg="board" class="on">看板<span class="sa-seg-badge" id="sa-seg-badge" hidden></span></button>
      <button data-seg="chat">对话</button>
    </div>
    <div id="sa-chat" class="sa-pane" hidden><div id="sa-panel" class="sa-scope"></div></div>
    <div id="sa-board" class="sa-pane sa-scroll"></div>
  </div>

  <!-- Kiki(语义分组第四空间) -->
  <div id="kiki-view">
    <div id="kiki-scroll"></div>
  </div>

  <!-- 底部合体悬浮胶囊:上层主输入(仅 moon 空间)/ 下层 TabBar 四空间 -->
  <div id="dock">
    <div id="main-input" hidden>
      <textarea id="mi-text" rows="1" placeholder="点击输入或按住说话…"></textarea>
      <button id="mi-voice" class="mi-btn" aria-label="语音">🎙</button>
      <button id="mi-send" class="mi-btn primary" aria-label="发送" hidden>➤</button>
    </div>
    <div id="tabbar">
      <button class="tab-item" data-space="chat"><span class="tab-icon">💬</span><span class="tab-label">Chat</span></button>
      <button class="tab-item" data-space="moon"><span class="tab-icon" id="tab-moon-icon"><span id="tab-moon-lit"></span></span><span class="tab-label">Moon</span></button>
      <button class="tab-item" data-space="sa"><span class="tab-icon tab-icon-sa">★</span><span class="tab-label">SA</span><span id="tab-sa-dot"></span><span id="tab-sa-count"></span></button>
      <button class="tab-item" data-space="kiki"><span class="tab-icon"><img id="tab-kiki-icon" src="./avatar.png" alt="Kiki" /></span><span class="tab-label">Kiki</span></button>
    </div>
  </div>

  <!-- SA 回执全文弹层 -->
  <div id="sa-modal">
    <div class="modal-card sa-modal-card">
      <div class="modal-title" id="sa-modal-title">回执</div>
      <div id="sa-modal-body"></div>
      <div class="modal-actions">
        <button id="sa-modal-close" class="text-btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 文件「信件」动画容器(文件推送本期不做,动画备用) -->
  <div id="file-transfer-container"></div>

  <script src="./vendor/three.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
